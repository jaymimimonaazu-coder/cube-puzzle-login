<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060a">
<title>NEON LATTICE / Cube Passcode</title>
<style>
  :root{
    color-scheme: dark;
    --ink:#dff6ff; --muted:#6d8794; --line:rgba(120,220,255,.16);
    --cy:#38e8ff; --mg:#ff3ec8; --lime:#b6ff3a; --warn:#ff5470;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden}
  body{
    background:
      radial-gradient(circle at 78% 22%, rgba(255,62,200,.10), transparent 38%),
      radial-gradient(circle at 18% 82%, rgba(56,232,255,.10), transparent 40%),
      #04060a;
    color:var(--ink);
    font-family:"Noto Sans JP","Yu Gothic UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  button{font:inherit}
  #app,canvas{position:fixed;inset:0;display:block}
  /* 走査線 */
  .scan{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.32;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.5) 2px 4px);
    mix-blend-mode:multiply;
  }
  .vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.72) 100%)}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;
    align-items:flex-start;justify-content:space-between;padding:24px 30px;pointer-events:none}
  .brand strong{display:block;font:600 13px/1 ui-monospace,monospace;letter-spacing:.34em;
    color:var(--cy);text-shadow:0 0 14px rgba(56,232,255,.6)}
  .brand small{display:block;margin-top:6px;color:var(--muted);font:9px/1 ui-monospace,monospace;letter-spacing:.2em}
  .combo{text-align:right;color:var(--muted);font:9px/1.7 ui-monospace,monospace;letter-spacing:.1em}
  .combo b{color:var(--mg);font-size:12px;text-shadow:0 0 12px rgba(255,62,200,.5)}

  .panel{position:fixed;left:30px;bottom:30px;z-index:5;width:min(340px,calc(100vw - 60px));
    padding:18px 20px;border:1px solid var(--line);border-radius:4px;
    background:linear-gradient(150deg,rgba(9,18,26,.86),rgba(4,7,11,.74));
    backdrop-filter:blur(18px);box-shadow:0 0 40px rgba(0,0,0,.6),inset 0 0 40px rgba(56,232,255,.03)}
  .mode{display:inline-block;padding:3px 9px;border:1px solid var(--cy);border-radius:2px;
    color:var(--cy);font:9px/1.4 ui-monospace,monospace;letter-spacing:.2em}
  .mode.auth{border-color:var(--mg);color:var(--mg)}
  .mode.locked{border-color:var(--warn);color:var(--warn)}
  .panel h1{margin:12px 0 8px;font:500 17px/1.5 "Noto Sans JP",sans-serif;letter-spacing:.02em}
  .panel p{margin:0;color:var(--muted);font-size:11px;line-height:1.85}

  .user{margin-top:14px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;
    background:rgba(0,0,0,.3);color:var(--ink);font:11px/1 ui-monospace,monospace;letter-spacing:.08em}
  .user:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}
  .faces{display:flex;gap:7px;margin-top:12px}
  .face{flex:1;height:34px;border:1px solid rgba(255,255,255,.13);border-radius:2px;
    display:grid;place-items:center;font:9px/1 ui-monospace,monospace;color:#4d6472;
    transition:.25s;position:relative;overflow:hidden}
  .face i{position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;opacity:.25}
  .face.part{color:#9fb6c2}
  .face.done{color:#04060a;font-weight:700}

  /* 照合の状況を常に画面に残す（トーストだけだと見逃す） */
  .status{display:flex;align-items:center;gap:9px;margin-top:12px;min-height:30px;
    padding:7px 10px;border:1px solid var(--line);border-radius:3px;
    background:rgba(0,0,0,.28);color:var(--muted);
    font:10px/1.5 ui-monospace,monospace;letter-spacing:.06em;transition:.2s}
  .status .mark{flex:0 0 auto;width:12px;height:12px;border-radius:50%;
    border:1px solid currentColor;position:relative}
  .status.pending{color:var(--cy);border-color:rgba(56,232,255,.4)}
  .status.pending .mark{border-color:transparent;border-top-color:var(--cy);
    border-right-color:var(--cy);animation:spin .7s linear infinite}
  .status.good{color:var(--lime);border-color:rgba(182,255,58,.42);background:rgba(182,255,58,.06)}
  .status.good .mark{background:var(--lime);border-color:var(--lime)}
  .status.bad{color:#ffbcc8;border-color:rgba(255,84,112,.5);background:rgba(255,84,112,.07)}
  .status.bad .mark{background:var(--warn);border-color:var(--warn)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.status.pending .mark{animation:none}}

  .row{display:flex;align-items:center;gap:10px;margin-top:14px}
  .bar{flex:1;height:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--cy);
    box-shadow:0 0 10px var(--cy);transition:width .4s cubic-bezier(.2,.8,.2,1)}
  #count{min-width:52px;color:var(--muted);font:9px/1 ui-monospace,monospace;letter-spacing:.12em}
  /* タップ領域を確保する（9pxのテキストリンクは指で押しにくい） */
  .ghost{padding:7px 9px;border:1px solid transparent;border-radius:3px;background:none;
    color:#7d94a8;cursor:pointer;font:10px/1 ui-monospace,monospace;letter-spacing:.12em;
    white-space:nowrap;transition:.18s}
  .ghost:hover{color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.04)}
  .ghost.danger:hover{color:var(--warn);border-color:rgba(255,84,112,.4)}
  /* モード切替は行き先を明示する（登録済みかをサーバーに尋ねない設計のため） */
  .ghost.switch{color:var(--cy);border-color:rgba(56,232,255,.32)}
  .ghost.switch:hover{background:rgba(56,232,255,.1);color:#bff4ff}

  .toast{position:fixed;z-index:8;left:50%;top:78px;padding:9px 16px;
    border:1px solid var(--line);border-radius:2px;background:rgba(6,12,17,.86);
    backdrop-filter:blur(12px);color:#a9c6d2;font:10px/1 ui-monospace,monospace;letter-spacing:.1em;
    opacity:0;transform:translate(-50%,-8px);transition:.22s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{color:#ffbcc8;border-color:rgba(255,84,112,.45)}
  .toast.good{color:#c9ffb0;border-color:rgba(182,255,58,.4)}

  .success{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:24px;
    background:rgba(3,5,8,.76);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .6s}
  .success.show{opacity:1;pointer-events:auto}
  .card{width:min(430px,100%);text-align:center}
  .card .ico{width:64px;height:64px;margin:0 auto 22px;display:grid;place-items:center;
    border:1px solid rgba(182,255,58,.4);border-radius:50%;color:var(--lime);font-size:22px;
    box-shadow:inset 0 0 26px rgba(182,255,58,.1),0 0 46px rgba(182,255,58,.14)}
  .card h2{margin:0;font:450 25px/1.3 ui-monospace,monospace;letter-spacing:.14em}
  .card p{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.85}
  .tok{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:2px;
    color:#6f8b98;font:9px/1.6 ui-monospace,monospace;word-break:break-all}
  .card button{margin-top:20px;border:0;border-bottom:1px solid #5d7583;padding:6px 0;
    background:none;color:var(--ink);cursor:pointer;font-size:11px}
  @media (max-width:640px){
    .topbar{padding:16px}.combo{display:none}
    .panel{left:12px;right:12px;bottom:12px;width:auto;padding:14px}
    .panel h1{font-size:15px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="scan"></div><div class="vig"></div>

<header class="topbar">
  <div class="brand"><strong>NEON LATTICE</strong><small>CUBE PASSCODE / SERVER-VERIFIED</small></div>
  <div class="combo">KEYSPACE<br><b>2,985,984,000,000</b><br>Argon2id · server-side</div>
</header>

<section class="panel">
  <span class="mode" id="modeTag">ENROLL</span>
  <h1 id="title">6面すべてに2箇所ずつ登録します。</h1>
  <p id="desc">立方体をドラッグで回転。各面のセルをタップして2箇所選んでください。6面ぶん揃うと登録されます。</p>
  <input id="user" class="user" autocomplete="off" spellcheck="false" placeholder="ユーザー名" value="demo">
  <div class="faces" id="faces"></div>
  <div class="status" id="status"><span class="mark"></span><span id="statusText">12箇所そろうと照合します</span></div>
  <div class="row">
    <div class="bar"><i id="bar"></i></div>
    <span id="count">0 / 12</span>
    <button class="ghost switch" id="mode">認証へ →</button>
    <button class="ghost" id="clear">CLEAR</button>
    <button class="ghost danger" id="forget">削除</button>
  </div>
</section>

<div class="toast" id="toast"></div>
<div class="success" id="success">
  <div class="card">
    <div class="ico">◈</div>
    <h2>ACCESS GRANTED</h2>
    <p>登録された配置と一致しました。<br>実運用では、この署名をサーバー側で照合します。</p>
    <div class="tok" id="tok"></div>
    <button id="again">ロックし直す</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = q => document.querySelector(q);

/* ---------- 基本セットアップ ---------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060a, .05);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 60);
camera.position.set(5.4, 3.6, 6.4);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
$("#app").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.enablePan = false; controls.minDistance = 5.4; controls.maxDistance = 13;

/* 画面レイアウトの調整。2つの要求を同時に満たす。
   1) HUDパネルの下に来たセルはクリックがパネルに吸われて選べない
      → 投影をずらして立方体をパネルの外に置く
   2) ずらすと画面端で見切れる
      → ずらした量と画面比から「収まる距離」を計算してカメラを引く
   毎回のリサイズでカメラを動かすと利用者のズームを奪うため、
   区分が変わったときだけ距離を再計算する（モバイルのアドレスバー対策）。 */
const CUBE_RADIUS = 2.95;   // 立方体の外接球（H√3 ＋ ネオン管のはみ出し）
let layoutKey = "";

function layoutView(force = false){
  const w = innerWidth, h = innerHeight, aspect = w / h;
  const panel = document.querySelector(".panel").getBoundingClientRect();

  // --- 逃がす方向と量 ---
  let dx = 0, dy = 0;
  if (w > 640) dx = -Math.min(panel.right * 0.62, w * 0.20);        // 右へ
  else         dy =  Math.min((h - panel.top) * 0.5, h * 0.16);     // 上へ
  camera.setViewOffset(w, h, dx, dy, w, h);

  // --- 収まる距離 ---
  // ずらした量はNDC上で中心の移動量になり、その分だけ使える半幅/半高が減る
  const key = `${Math.round(aspect * 20)}|${Math.round(dx)}|${Math.round(dy)}`;
  if (!force && key === layoutKey) return;
  layoutKey = key;

  const shiftX = Math.min(Math.abs(dx) * 2 / w, .8);
  const shiftY = Math.min(Math.abs(dy) * 2 / h, .8);
  const tanHalfFov = Math.tan(camera.fov * Math.PI / 360);
  const usable = Math.min(1 - shiftY, aspect * (1 - shiftX));
  const dist = CUBE_RADIUS / (tanHalfFov * Math.max(usable, .12) * .94);

  // 近づきすぎると、横にずらした投影の影響で立方体が大きく歪んで見える。
  // 「収まる距離」を基準に寄れる範囲を制限する。
  controls.minDistance = dist * .82;
  controls.maxDistance = dist * 1.9;
  const dir = camera.position.length()
    ? camera.position.clone().normalize()
    : new THREE.Vector3(5.4, 3.6, 6.4).normalize();
  camera.position.copy(dir.multiplyScalar(dist));
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .62, .38, .34);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight(0x2a4a5c, 1.2));

/* 床グリッド */
const grid = new THREE.GridHelper(26, 26, 0x1e5f74, 0x123847);
grid.position.y = -2.6; grid.material.transparent = true; grid.material.opacity = .5; scene.add(grid);

/* ---------- ネオン管フレーム ---------- */
const cube = new THREE.Group(); scene.add(cube);
const H = 1.62, TUBE = 0.026;
// 白飛びを避けるため、コアは白ではなく淡いシアンにする
const tubeCore = new THREE.MeshBasicMaterial({ color:0x86ecff });
const tubeGlow = new THREE.MeshBasicMaterial({
  color:0x1f9fd0, transparent:true, opacity:.10, blending:THREE.AdditiveBlending, depthWrite:false });

function neonEdge(a, b){
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const len = A.distanceTo(B), mid = A.clone().add(B).multiplyScalar(.5);
  const q = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0,1,0), B.clone().sub(A).normalize());
  const core = new THREE.Mesh(new THREE.CylinderGeometry(TUBE, TUBE, len, 10), tubeCore);
  core.position.copy(mid); core.quaternion.copy(q); cube.add(core);
  const glow = new THREE.Mesh(new THREE.CylinderGeometry(TUBE*2.8, TUBE*2.8, len, 10), tubeGlow);
  glow.position.copy(mid); glow.quaternion.copy(q); cube.add(glow);
}
for (const y of [-H,H]) for (const z of [-H,H]) neonEdge([-H,y,z],[H,y,z]);
for (const x of [-H,H]) for (const z of [-H,H]) neonEdge([x,-H,z],[x,H,z]);
for (const x of [-H,H]) for (const y of [-H,H]) neonEdge([x,y,-H],[x,y,H]);
/* 角のノード */
const nodeGeo = new THREE.SphereGeometry(TUBE*2.4, 14, 10);
for (const x of [-H,H]) for (const y of [-H,H]) for (const z of [-H,H]) {
  const n = new THREE.Mesh(nodeGeo, tubeCore); n.position.set(x,y,z); cube.add(n);
}

/* ---------- 6面 × 4×4 セル ---------- */
const FACES = [
  { name:"C", label:"CYAN",    color:0x38e8ff, n:[ 1,0,0], u:[0,0,-1], v:[0,-1,0] },
  { name:"M", label:"MAGENTA", color:0xff3ec8, n:[-1,0,0], u:[0,0, 1], v:[0,-1,0] },
  { name:"L", label:"LIME",    color:0xb6ff3a, n:[0, 1,0], u:[1,0, 0], v:[0,0, 1] },
  { name:"A", label:"AMBER",   color:0xffa42b, n:[0,-1,0], u:[1,0, 0], v:[0,0,-1] },
  { name:"V", label:"VIOLET",  color:0x9b6cff, n:[0,0, 1], u:[1,0, 0], v:[0,-1,0] },
  { name:"R", label:"RED",     color:0xff4d5e, n:[0,0,-1], u:[-1,0,0], v:[0,-1,0] },
];
const STEP = 0.74, PAD = 0.60;
const padGeo = new THREE.PlaneGeometry(PAD, PAD);
const frameGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(PAD*1.06, PAD*1.06));
const pads = [];

FACES.forEach((f, fi) => {
  const n = new THREE.Vector3(...f.n), u = new THREE.Vector3(...f.u), v = new THREE.Vector3(...f.v);
  f.selected = new Set();
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const idx = r*4 + c;
    const pos = n.clone().multiplyScalar(H - .03)
      .add(u.clone().multiplyScalar((c - 1.5) * STEP))
      .add(v.clone().multiplyScalar((r - 1.5) * STEP));
    const mat = new THREE.MeshBasicMaterial({
      color:f.color, transparent:true, opacity:.10, side:THREE.DoubleSide, depthWrite:false });
    const mesh = new THREE.Mesh(padGeo, mat);
    mesh.position.copy(pos); mesh.lookAt(pos.clone().add(n));
    const frame = new THREE.LineSegments(frameGeo, new THREE.LineBasicMaterial({
      color:f.color, transparent:true, opacity:.42 }));
    frame.position.copy(mesh.position); frame.quaternion.copy(mesh.quaternion);
    cube.add(mesh); cube.add(frame);
    const pad = { face:fi, idx, mesh, frame, mat, fmat:frame.material, on:false, pulse:0 };
    mesh.userData.pad = pad; pads.push(pad);
  }
});
/* 手前を向いている面だけを濃く出す（奥の面は沈めて視認性を確保） */
const faceFacing = new Array(6).fill(1);
const _n = new THREE.Vector3(), _p = new THREE.Vector3();
function updateFacing(){
  FACES.forEach((f, i) => {
    const first = pads[i*16].mesh;
    first.getWorldDirection(_n);
    first.getWorldPosition(_p);
    const d = _n.dot(camera.position.clone().sub(_p).normalize());
    // 正面 1.0 → 側面 → 裏面 0.14 へなめらかに
    faceFacing[i] = THREE.MathUtils.clamp((d + .12) / .55, 0, 1) * .86 + .14;
  });
}
function paint(pad){
  const k = faceFacing[pad.face];
  pad.mat.opacity  = (pad.on ? .90 : .10) * k;
  pad.fmat.opacity = (pad.on ? 1   : .42) * k;
}
function paintAll(){ for (const p of pads) paint(p); }

/* ---------- 状態 ---------- */
// 照合はすべてサーバー側。ブラウザには正解もハッシュも保持しない。
// モードは利用者が選ぶ。以前は /api/status で登録済みかを問い合わせていたが、
// あのAPIは「そのユーザー名が存在するか」を誰にでも教えてしまうため廃止した（監査M-5）。
let mode = "enroll";
let locked = false;
let session = null;            // 認証成功時にサーバーが発行するトークン
const userEl = $("#user");
const username = () => userEl.value.trim() || "demo";

async function api(path, body, auth = false){
  const headers = { "Content-Type": "application/json" };
  if (auth && session) headers["Authorization"] = `Bearer ${session}`;
  const res = await fetch(path, { method: "POST", headers, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch {}
  return { status: res.status, data };
}
function setMode(next){
  mode = next; locked = false; clearSelection(); refresh();
  setStatus("", next === "enroll"
    ? "登録モード: 12箇所そろうと登録します"
    : "認証モード: 12箇所そろうと照合します");
}

const facesEl = $("#faces");
FACES.forEach(f => {
  const d = document.createElement("div");
  d.className = "face"; d.dataset.face = f.name;
  d.innerHTML = `<span>${f.name}</span><i></i>`;
  d.style.color = "#" + f.color.toString(16).padStart(6, "0");
  facesEl.appendChild(d);
});
const faceEls = [...facesEl.children];

function totalSelected(){ return FACES.reduce((s,f) => s + f.selected.size, 0); }
function refresh(){
  const total = totalSelected();
  $("#bar").style.width = `${total / 12 * 100}%`;
  $("#count").textContent = `${total} / 12`;
  FACES.forEach((f, i) => {
    const el = faceEls[i];
    el.classList.toggle("part", f.selected.size === 1);
    el.classList.toggle("done", f.selected.size === 2);
    el.style.background = f.selected.size === 2 ? el.style.color : "transparent";
    el.style.borderColor = f.selected.size ? el.style.color : "rgba(255,255,255,.13)";
  });
  const tag = $("#modeTag");
  tag.className = "mode" + (locked ? " locked" : mode === "auth" ? " auth" : "");
  tag.textContent = locked ? "LOCKED" : mode === "auth" ? "AUTHENTICATE" : "ENROLL";
  // 切替先を明示する（サーバーに登録有無を尋ねない設計なので利用者が選ぶ）
  $("#mode").textContent = mode === "auth" ? "← 登録へ" : "認証へ →";
  if (locked) {
    $("#title").textContent = "試行回数の上限に達しました。";
    $("#desc").textContent = "サーバー側でロック中です。時間をおいて再入力してください。";
  } else if (mode === "auth") {
    $("#title").textContent = "登録した12箇所を入力してください。";
    $("#desc").textContent = "各面2箇所ずつ。6面すべて揃うと自動で照合します。";
  } else {
    $("#title").textContent = "6面すべてに2箇所ずつ登録します。";
    $("#desc").textContent = "立方体をドラッグで回転。各面のセルをタップして2箇所選んでください。6面ぶん揃うと登録されます。";
  }
}

let toastTimer;
function toast(msg, kind = ""){
  clearTimeout(toastTimer);
  const el = $("#toast"); el.textContent = msg;
  el.className = "toast show " + kind;
  toastTimer = setTimeout(() => el.className = "toast " + kind, kind === "bad" ? 2800 : 2100);
}

function clearSelection(){
  FACES.forEach(f => f.selected.clear());
  pads.forEach(p => { p.on = false; paint(p); });
  refresh();
}

/* ---------- 入力 ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = { x:e.clientX, y:e.clientY }; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 6 || locked || busy) return;          // ドラッグは回転として扱う
  const rect = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - rect.left) / rect.width) * 2 - 1,
         -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  // 奥側の面を透かして誤タップしないよう、手前を向いた面のセルだけを対象にする
  const hit = ray.intersectObjects(pads.map(p => p.mesh), false)
                 .find(h => faceFacing[h.object.userData.pad.face] > .55);
  if (hit) togglePad(hit.object.userData.pad);
});

let busy = false;
function togglePad(pad){
  const f = FACES[pad.face];
  if (pad.on) { f.selected.delete(pad.idx); pad.on = false; }
  else {
    if (f.selected.size >= 2) { toast(`${f.label} は既に2箇所です`, "bad"); return; }
    f.selected.add(pad.idx); pad.on = true; pad.pulse = 1;
  }
  paint(pad); refresh();
  const n = totalSelected();
  if (n === 12) {
    busy = true;
    setStatus("pending", "12箇所そろいました。送信します…");
    setTimeout(submit, 420);
  } else if (!busy) {
    setStatus("", `あと ${12 - n} 箇所（そろうと自動で照合します）`);
  }
}

/* ---------- 照合（サーバー） ---------- */
// 選択を [[c,c],...] の配列にしてサーバーへ送る。ハッシュ化はサーバーが行う。
function passcode(){
  return FACES.map(f => [...f.selected].sort((a,b) => a-b));
}

/* 照合の状況をパネルに残す。トーストは消えるので、結果はここに保持する。 */
function setStatus(kind, text){
  $("#status").className = "status" + (kind ? " " + kind : "");
  $("#statusText").textContent = text;
}

/* 拒否されたことを分かるようにする。
   選択したセルを赤く光らせてから消す（即座に消えると
   「送信されたのか」が分からない）。 */
function flashDenied(){
  const chosen = pads.filter(p => p.on);
  chosen.forEach(p => { p.mat.color.setHex(0xff4d5e); p.fmat.color.setHex(0xff4d5e); });
  shake = .36;
  setTimeout(() => {
    chosen.forEach(p => {
      const c = FACES[p.face].color;
      p.mat.color.setHex(c); p.fmat.color.setHex(c);
    });
    clearSelection();
  }, 640);
}

function fail(msg){ flashDenied(); setStatus("bad", msg); toast(msg, "bad"); }

async function submit(){
  const body = { username: username(), passcode: passcode() };
  setStatus("pending", mode === "enroll"
    ? "サーバーに送信中… 配置を検査しています"
    : "サーバーに送信中… Argon2idで照合しています");
  try {
    if (mode === "enroll") {
      const { status, data } = await api("/api/enroll", body);
      const d = data.detail || {};
      if (status === 200) {
        // サーバーは推定ビット値を返さない（単一パスコードからは推定不能なため）
        mode = "auth"; clearSelection(); refresh();
        setStatus("good", "登録しました。同じ12箇所を入力して認証してください");
        toast("ENROLLED — 認証モードへ", "good");
      } else if (status === 409) {
        fail("この名前は登録済みです。認証してください");
      } else if (status === 422) {
        // 弱い規則に該当。サーバーが該当理由を返す
        fail(d.reasons ? d.reasons[0] : (d.message || "推測されやすい配置です"));
      } else if (status === 413) {
        fail("リクエストが大きすぎます");
      } else if (status === 429) {
        fail("リクエストが多すぎます。少し待ってください");
      } else if (status === 503) {
        fail("サーバーが混雑しています");
      } else {
        fail(d.message || "登録できません");
      }
    } else {
      const { status, data } = await api("/api/authenticate", body);
      const d = data.detail || {};
      if (status === 200) {
        session = data.session;
        $("#tok").textContent = `SESSION / ${session.slice(0,32).toUpperCase()}`;
        $("#success").classList.add("show");
        setStatus("good", "照合成功。セッションを発行しました");
      } else if (status === 429) {
        // 既定ではロック状態を応答から判別できない（列挙対策）。
        // NEON_REVEAL_LOCK=1 のときだけ retry_after が返る。
        locked = !!d.retry_after; refresh();
        fail(d.retry_after ? `RATE LIMIT — ${d.retry_after}秒` : "リクエストが多すぎます");
      } else if (status === 503) {
        fail("サーバーが混雑しています");
      } else {
        fail(d.message || "ACCESS DENIED");
      }
    }
  } catch {
    fail("サーバーに接続できません");
  } finally {
    busy = false;
  }
}

$("#clear").addEventListener("click", () => {
  if (!busy) { clearSelection(); setStatus("", "選択を消しました"); }
});
$("#mode").addEventListener("click", () => {
  if (!busy) setMode(mode === "enroll" ? "auth" : "enroll");
});
$("#forget").addEventListener("click", async () => {
  // 削除は認証済みセッションが必要（監査H-2）
  if (!session) {
    setStatus("bad", "削除には本人確認が必要です。先に認証してください");
    toast("先に認証してください（削除には本人確認が必要）", "bad"); return;
  }
  setStatus("pending", "削除を要求しています…");
  const { status } = await api("/api/forget", { username: username() }, true);
  if (status === 200) {
    session = null; setMode("enroll");
    setStatus("good", "登録を消去しました。再登録できます");
    toast("登録を消去しました。再登録してください。");
  } else {
    setStatus("bad", "削除できません（認証が必要です）");
    toast("削除できません（認証が必要です）", "bad");
  }
});
userEl.addEventListener("change", () => { session = null; setMode("enroll"); });
$("#again").addEventListener("click", () => {
  $("#success").classList.remove("show"); clearSelection(); refresh();
});

/* ---------- 描画ループ ---------- */
let shake = 0;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;

  // ネオン管のゆらぎ
  tubeGlow.opacity = .10 + Math.sin(t * 2.1) * .025 + (Math.random() < .012 ? -.055 : 0);

  // 面の向きに応じた濃淡を毎フレーム更新
  updateFacing(); paintAll();

  // 選択セルの点灯パルス
  for (const p of pads) {
    if (p.pulse > 0) { p.pulse -= dt * 2.2; p.mat.opacity += Math.max(p.pulse, 0) * .4; }
  }
  if (shake > 0) { shake -= dt; cube.position.x = Math.sin(shake * 90) * .05; }
  else cube.position.x += (0 - cube.position.x) * .2;

  cube.rotation.y += dt * .045;   // ゆっくり自転
  controls.update();
  composer.render();
}
clearSelection(); animate(); refresh(); layoutView(true);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
  layoutView();                      // 内部で updateProjectionMatrix される
});
</script>
</body>
</html>
