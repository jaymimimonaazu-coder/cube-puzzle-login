<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON LATTICE — アプリ構造</title>
<style>
  :root{
    --bg:#05070c; --panel:#0c111a; --panel2:#0f1622; --line:rgba(120,200,255,.14);
    --ink:#e2eefc; --muted:#7d94a8; --cy:#38e8ff; --mg:#ff3ec8; --lime:#b6ff3a;
    --amber:#ffa42b; --violet:#9b6cff; --red:#ff4d5e; --warn:#ff5470; --ok:#4bd88a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(circle at 82% -5%,rgba(255,62,200,.08),transparent 40%),
      radial-gradient(circle at 5% 8%,rgba(56,232,255,.08),transparent 42%),
      var(--bg);
    color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI",Inter,system-ui,sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 22px 80px}
  a{color:var(--cy)}
  code{font-family:ui-monospace,monospace;font-size:.86em;background:rgba(255,255,255,.06);
    padding:1px 6px;border-radius:4px}
  h2{font-size:15px;letter-spacing:.16em;color:var(--cy);text-transform:uppercase;
    margin:52px 0 4px;font-weight:600}
  h2 .en{color:var(--muted);font-size:10px;letter-spacing:.24em;display:block;margin-top:2px}
  .rule{height:1px;background:linear-gradient(90deg,var(--cy),transparent);margin:8px 0 22px;opacity:.5}

  /* header */
  header{border:1px solid var(--line);border-radius:12px;padding:28px 30px;
    background:linear-gradient(150deg,var(--panel2),var(--panel));position:relative;overflow:hidden}
  header::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.22) 3px 4px);opacity:.5}
  .kicker{color:var(--mg);font:600 10px/1 ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase}
  header h1{margin:12px 0 6px;font-size:27px;letter-spacing:.02em}
  header p{margin:0;color:var(--muted);font-size:13px;max-width:640px}
  .stat{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
  .stat div{position:relative;z-index:1}
  .stat b{display:block;font:700 22px/1 ui-monospace,monospace;color:var(--lime);
    text-shadow:0 0 18px rgba(182,255,58,.35)}
  .stat span{color:var(--muted);font:10px/1.4 ui-monospace,monospace;letter-spacing:.1em}

  /* variants */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .card{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--panel);
    border-top:2px solid var(--cy)}
  .card.client{border-top-color:var(--amber)}
  .card.server{border-top-color:var(--ok)}
  .card .k{font:10px/1 ui-monospace,monospace;letter-spacing:.14em;color:var(--muted)}
  .card h3{margin:8px 0 4px;font-size:15px}
  .card .p{margin:0;color:#a9bccb;font-size:12px}
  .card .path{margin-top:12px;font:11px/1 ui-monospace,monospace;color:var(--cy)}
  .badge{display:inline-block;margin-top:12px;padding:3px 9px;border-radius:3px;
    font:9px/1.4 ui-monospace,monospace;letter-spacing:.12em;border:1px solid}
  .badge.client-only{color:var(--warn);border-color:rgba(255,84,112,.4)}
  .badge.server-verified{color:var(--ok);border-color:rgba(75,216,138,.4)}

  /* keyspace bars */
  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:grid;grid-template-columns:180px 1fr 54px;align-items:center;gap:12px;font-size:12px}
  .barrow .track{display:block;height:8px;background:rgba(255,255,255,.045);border-radius:99px;overflow:hidden}
  .barrow .fill{display:block;height:100%;background:var(--cy);border-radius:99px;box-shadow:0 0 12px rgba(56,232,255,.55)}
  .barrow.hi .fill{background:var(--lime);box-shadow:0 0 14px rgba(182,255,58,.55)}
  .barrow.hi{color:var(--lime);font-weight:600}
  .barrow .b{text-align:right;font:11px/1 ui-monospace,monospace;color:var(--muted)}

  /* flow */
  .flow{border:1px solid var(--line);border-radius:10px;padding:18px 20px;background:var(--panel);margin-bottom:14px}
  .flow h3{margin:0 0 14px;font-size:14px;color:var(--ink)}
  .steps{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
  .step{flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    background:var(--panel2);position:relative}
  .step .who{font:9px/1.4 ui-monospace,monospace;letter-spacing:.1em;margin-bottom:4px}
  .step.利用者 .who{color:var(--cy)} .step.ブラウザ .who{color:var(--violet)} .step.サーバー .who{color:var(--lime)}
  .step .t{font-size:11.5px;color:#bcccd9}
  .step .n{position:absolute;top:8px;right:9px;font:9px/1 ui-monospace,monospace;color:#40546a}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font:10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
  td code{white-space:nowrap}
  .method{font:700 10px/1 ui-monospace,monospace;padding:3px 7px;border-radius:3px}
  .method.POST{background:rgba(155,108,255,.16);color:#c3a6ff}
  .method.GET{background:rgba(56,232,255,.14);color:var(--cy)}

  .res{font-weight:600}
  .res.突破{color:var(--warn)} .res.無効{color:var(--ok)} .res.緩和{color:var(--amber)}
  .res\.- {color:var(--muted)}
  .dash{color:#3a4a5c}

  /* file tree */
  .tree{font:12px/1.9 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;background:var(--panel);overflow-x:auto}
  .tree .g{color:var(--muted);margin-top:6px;letter-spacing:.1em;font-size:10px}
  .tree .f{color:var(--ink)} .tree .d{color:var(--muted)}
  .tree .f b{color:var(--cy);font-weight:400}

  .caveat{margin:14px 0 0;padding:12px 14px;border-left:2px solid var(--amber);
    background:rgba(255,164,43,.06);color:#c9b493;font-size:11.5px;line-height:1.85}
  .audited{margin-top:14px;padding:8px 12px;border:1px solid rgba(75,216,138,.35);
    border-radius:3px;color:var(--ok);font:10px/1.6 ui-monospace,monospace;display:inline-block}
  .pill{display:inline-block;margin:3px 5px 3px 0;padding:4px 10px;border:1px solid var(--line);
    border-radius:99px;font:11px/1 ui-monospace,monospace;color:#a9bccb}
  ul.todo{margin:0;padding-left:18px}
  ul.todo li{font-size:12.5px;color:#a9bccb;margin:3px 0}
  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--muted);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .src{font:10px/1 ui-monospace,monospace;color:#3f5266}
  @media(max-width:560px){.barrow{grid-template-columns:110px 1fr 46px}.stat{gap:16px}}
</style>
</head>

        "name": "A",
        "label": "AMBER",
        "color": "#ffa42b"
      },
      {
        "name": "V",
        "label": "VIOLET",
        "color": "#9b6cff"
      },
      {
        "name": "R",
        "label": "RED",
        "color": "#ff4d5e"
      }
    ]
  },
  "tech": {
    "frontend": [
      "Three.js 0.160",
      "OrbitControls",
      "UnrealBloomPass",
      "Web Crypto (demo)"
    ],
    "backend": [
      "FastAPI",
      "argon2-cffi",
      "SQLite (stdlib)",
      "pydantic (strict)",
      "uvicorn"
    ],
    "tests": "pytest 50件（監査13件の回帰テストを含む）すべて合格"
  },
  "crack_time": {
    "note": "「最悪」は全件探索、「平均」はその半分。オンラインの数値はレート制限が正しく機能する前提。",
    "rows": [
      {
        "scenario": "オンライン（5回/15分・レート制限あり）",
        "worst": "1700万年",
        "average": "850万年",
        "status": "修正後に有効。監査前は競合バグにより無効だった"
      },
      {
        "scenario": "DB漏洩・SHA-256（旧クライアント版）",
        "worst": "約2.5分",
        "average": "約75秒",
        "status": "この構成は使用していない（比較用）"
      },
      {
        "scenario": "DB漏洩・Argon2id・GPU1台",
        "worst": "約47年",
        "average": "約24年",
        "status": "2,000 H/s という未実証の仮定に基づく"
      },
      {
        "scenario": "DB漏洩・Argon2id・GPU1000台",
        "worst": "約17日",
        "average": "約8.6日",
        "status": "2,000 H/s という未実証の仮定に基づく"
      }
    ],
    "assumption_warning": "Argon2id の 2,000 H/s は実測ではなく仮定。GPU・実装・m/t/p・同時ハッシュ数で大きく変わるため、実測なしに一般化はできない（Codex指摘）。"
  }
}
</script>

<script>
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// architecture.json を優先し、file:// 等で読めなければ埋め込みへフォールバック
async function loadData(){
  try{
    const r = await fetch('architecture.json', {cache:'no-store'});
    if(r.ok) return {data: await r.json(), src:'architecture.json (fetch)'};
  }catch(e){}
  return {data: JSON.parse(document.getElementById('fallback').textContent), src:'内蔵コピー（fetch不可のため）'};
}

function render({data:d, src}){
  const k = d.keyspace, maxBits = Math.max(...k.comparisons.map(c=>c.bits));
  const app = document.getElementById('app');
  app.innerHTML = '';

  // header
  app.appendChild($(`
    <header>
      <div class="kicker">Application Architecture</div>
      <h1>${esc(d.meta.name)}</h1>
      <p>${esc(d.meta.tagline)}</p>
      <div class="stat">
        <div><b>${k.total.toLocaleString()}</b><span>KEYSPACE / ${esc(k.total_formula)}</span></div>
        <div><b>${k.bits} bit</b><span>ENTROPY</span></div>
        <div><b>${d.variants.length}</b><span>VARIANTS</span></div>
        <div><b>${esc(d.meta.version)}</b><span>VERSION · ${esc(d.meta.updated)}</span></div>
      </div>
      ${d.meta.audited ? `<div class="audited">✓ ${esc(d.meta.audited)}</div>` : ''}
    </header>`));

  // variants
  sec(app,'構成バリアント','Variants');
  const cards = $(`<div class="cards"></div>`);
  d.variants.forEach(v=>{
    const cls = v.security==='server-verified'?'server':v.security==='client-only'?'client':'';
    cards.appendChild($(`
      <div class="card ${cls}">
        <div class="k">${esc(v.kind)}</div>
        <h3>${esc(v.title)}</h3>
        <p class="p">${esc(v.summary)}</p>
        <div class="path">${esc(v.path)}</div>
        <span class="badge ${v.security}">${v.security==='server-verified'?'SERVER-VERIFIED':'CLIENT-ONLY'}</span>
      </div>`));
  });
  app.appendChild(cards);

  // keyspace
  sec(app,'鍵空間','Keyspace');
  const bars = $(`<div class="bars"></div>`);
  k.comparisons.forEach(c=>{
    bars.appendChild($(`
      <div class="barrow ${c.highlight?'hi':''}">
        <span>${esc(c.label)}</span>
        <span class="track"><span class="fill" style="width:${(c.bits/maxBits*100).toFixed(0)}%"></span></span>
        <span class="b">${c.bits} bit</span>
      </div>`));
  });
  app.appendChild(bars);

  if (k.caveat) app.appendChild($(`<p class="caveat">⚠ ${esc(k.caveat)}</p>`));

  // crack time
  if (d.crack_time) {
    sec(app,'全探索にかかる時間','Exhaustive search');
    const ct = $(`<table><thead><tr><th>シナリオ</th><th>最悪</th><th>平均</th><th>前提</th></tr></thead><tbody></tbody></table>`);
    d.crack_time.rows.forEach(r => ct.querySelector('tbody').appendChild($(`
      <tr><td><b>${esc(r.scenario)}</b></td>
        <td style="white-space:nowrap;color:var(--lime)">${esc(r.worst)}</td>
        <td style="white-space:nowrap;color:var(--muted)">${esc(r.average)}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(r.status)}</td></tr>`)));
    app.appendChild(ct);
    app.appendChild($(`<p class="caveat">⚠ ${esc(d.crack_time.assumption_warning)}</p>`));
  }

  // flows
  sec(app,'データフロー','Data flow');
  d.flows.forEach(f=>{
    const flow = $(`<div class="flow"><h3>${esc(f.title)}</h3></div>`);
    const steps = $(`<div class="steps"></div>`);
    f.steps.forEach((s,i)=> steps.appendChild($(`
      <div class="step ${s.actor}"><span class="n">${i+1}</span>
        <div class="who">${esc(s.actor)}</div><div class="t">${esc(s.text)}</div></div>`)));
    flow.appendChild(steps); app.appendChild(flow);
  });

  // api
  sec(app,'API エンドポイント','API');
  const api = $(`<table><thead><tr><th>Method</th><th>Path</th><th>Request</th><th>Response</th><th>説明</th></tr></thead><tbody></tbody></table>`);
  const tb = api.querySelector('tbody');
  d.api.forEach(a=> tb.appendChild($(`
    <tr><td><span class="method ${a.method}">${a.method}</span></td>
      <td><code>${esc(a.path)}</code></td><td><code>${esc(a.req)}</code></td>
      <td>${esc(a.res)}</td><td>${esc(a.desc)}</td></tr>`)));
  app.appendChild(api);

  // security stack
  sec(app,'セキュリティ層','Security stack');
  const ss = $(`<table><thead><tr><th>層</th><th>技術</th><th>目的</th></tr></thead><tbody></tbody></table>`);
  d.security.stack.forEach(s=> ss.querySelector('tbody').appendChild($(`
    <tr><td><b>${esc(s.layer)}</b></td><td><code>${esc(s.tech)}</code></td><td>${esc(s.purpose)}</td></tr>`)));
  app.appendChild(ss);

  // attack matrix
  sec(app,'攻撃 × 耐性','Threat matrix');
  const am = $(`<table><thead><tr><th>攻撃</th><th>クライアント版</th><th>サーバー版</th></tr></thead><tbody></tbody></table>`);
  d.security.attacks.forEach(a=>{
    am.querySelector('tbody').appendChild($(`
      <tr><td><b>${esc(a.name)}</b></td>
        <td>${cell(a.client)}</td><td>${cell(a.server)}</td></tr>`));
  });
  app.appendChild(am);

  // files
  sec(app,'ファイル構成','Files');
  const groups = {};
  d.files.forEach(f=> (groups[f.group] ??= []).push(f));
  const tree = $(`<div class="tree"></div>`);
  Object.entries(groups).forEach(([g,items])=>{
    tree.appendChild($(`<div class="g">── ${g} ──</div>`));
    items.forEach(f=> tree.appendChild($(`<div class="f"><b>${esc(f.path)}</b> <span class="d">— ${esc(f.desc)}</span></div>`)));
  });
  app.appendChild(tree);

  // tech + todo
  sec(app,'技術スタック','Tech');
  const tech = $(`<div></div>`);
  [['Frontend',d.tech.frontend],['Backend',d.tech.backend]].forEach(([label,arr])=>{
    tech.appendChild($(`<div style="margin-bottom:8px"><span class="src">${label}</span><br>${
      arr.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div>`));
  });
  tech.appendChild($(`<div class="src" style="margin-top:6px">Tests — ${esc(d.tech.tests)}</div>`));
  app.appendChild(tech);

  sec(app,'本番導入で追加すべきこと','Production TODO');
  const todo = $(`<ul class="todo"></ul>`);
  d.security.production_todo.forEach(t=> todo.appendChild($(`<li>${esc(t)}</li>`)));
  app.appendChild(todo);

  app.appendChild($(`<footer><span>${esc(d.meta.repository)}</span><span class="src">source: ${esc(src)}</span></footer>`));
}

function cell(o){
  if(!o || o.result==='-') return `<span class="dash">—</span>`;
  return `<span class="res ${o.result}">${esc(o.result)}</span> <span style="color:var(--muted);font-size:11px">${esc(o.note)}</span>`;
}
function sec(app,ja,en){
  app.appendChild($(`<h2>${esc(ja)}<span class="en">${esc(en)}</span></h2>`));
  app.appendChild($(`<div class="rule"></div>`));
}

loadData().then(render);
</script>
</body>
</html>
